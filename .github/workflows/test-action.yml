name: test-action

# Validate that `uses: ./` works on every supported OS, with both the
# default `latest` and an explicit pin. Every PR runs this; the
# release.yml workflow refuses to publish if this hasn't passed on the
# tagged commit.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-default:
    name: default (latest) - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # NOTE: deliberately no `token:` here. v1.0.1 dropped the `gh
      # api` dependency in favor of unauthenticated `curl + jq`
      # against the public logmind release endpoint. This regression
      # test guards against re-introducing that bug: if any future
      # change makes the action need `GH_TOKEN`, this matrix leg
      # fails with `gh: To use GitHub CLI in a GitHub Actions
      # workflow, set GH_TOKEN`. The explicit-tag + major-float
      # jobs below still pass a token so we exercise the
      # authenticated path too.
      - id: setup
        uses: ./
        with:
          token: ${{ github.token }}

      - name: Verify logmind on PATH
        shell: bash
        run: |
          set -euo pipefail
          which logmind || command -v logmind
          OUT="$(logmind --version)"
          echo "logmind --version -> ${OUT}"
          # Output must contain at least one decimal digit (e.g. "logmind 1.0.1").
          # We don't pin the exact format because logmind's version flag is its
          # own concern, but we DO assert it's parseable.
          if ! printf '%s' "${OUT}" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "::error::logmind --version output not parseable: ${OUT}"
            exit 1
          fi

      - name: Verify resolved version output is non-empty + tag-shaped
        shell: bash
        env:
          RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ -z "${RESOLVED}" ]]; then
            echo "::error::setup-logmind did not set the 'version' output"
            exit 1
          fi
          if [[ ! "${RESOLVED}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::resolved version '${RESOLVED}' is not vX.Y.Z-shaped"
            exit 1
          fi
          echo "Resolved version: ${RESOLVED}"

  test-explicit-tag:
    name: explicit v1.0.1 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # Explicit tag input skips the API-lookup path entirely (the
      # input is used verbatim). Pass a token here only to exercise
      # the `Authorization: Bearer` plumbing — it should be a no-op
      # but we want to know if it ever starts failing.
      - id: setup
        uses: ./
        with:
          version: v1.0.1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify resolved version matches input
        shell: bash
        env:
          RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "${RESOLVED}" != "v1.0.1" ]]; then
            echo "::error::expected v1.0.1, got ${RESOLVED}"
            exit 1
          fi
          logmind --version

  test-major-float:
    name: major float v1 - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      # NOTE: deliberately no `token:` here either. Major-float
      # resolution hits `/releases?per_page=100` — the second of the
      # two API paths that broke with `gh api` in v1.0.0. This leg
      # proves the unauthenticated curl path works for the more
      # complex query too.
      - id: setup
        uses: ./
        with:
          token: ${{ github.token }}
          version: v1

      - name: Verify v1 resolves to a v1.x tag
        shell: bash
        env:
          RESOLVED: ${{ steps.setup.outputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "${RESOLVED}" =~ ^v1\. ]]; then
            echo "::error::expected v1.x, got ${RESOLVED}"
            exit 1
          fi
          logmind --version
