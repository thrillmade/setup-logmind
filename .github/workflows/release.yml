name: release

# Fires on push of a `v*` tag. Two responsibilities:
#   1. Refuse to release unless test-action.yml passed on the same SHA.
#   2. Force-push the major float (e.g. when v1.0.1 is tagged, also push
#      v1 -> same SHA). This is the only place that moving tag is
#      maintained; consumers can opt in via `@v1` but the README leads
#      with static pins.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-tests-passed:
    name: Verify test-action.yml passed on this SHA
    runs-on: ubuntu-latest
    # Only the 3-part vX.Y.Z tags should run the test check + create a
    # release. The bare `v<MAJOR>` tag is force-pushed BY this workflow
    # and re-fires this trigger — we don't want it to loop on itself.
    if: contains(github.ref_name, '.')
    steps:
      - name: Wait for all test-action matrix legs on this SHA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Required check names — must match the job-name strings
          # rendered by .github/workflows/test-action.yml.
          REQUIRED_CHECKS=(
            "default (latest) - ubuntu-latest"
            "default (latest) - macos-latest"
            "default (latest) - windows-latest"
            "explicit v1.0.1 - ubuntu-latest"
            "explicit v1.0.1 - macos-latest"
            "explicit v1.0.1 - windows-latest"
            "major float v1 - ubuntu-latest"
            "major float v1 - macos-latest"
            "major float v1 - windows-latest"
          )

          # Poll every 15s up to 30 min. Each check must reach
          # `completed` with conclusion `success`. Any other terminal
          # conclusion (failure/cancelled/timed_out/skipped/...) hard-
          # fails the release. This replaces lewagon/wait-on-check-
          # action — the third-party allowlist on this org doesn't
          # whitelist that action, and gh CLI does the same job in
          # ~30 lines of bash.
          DEADLINE=$(( $(date +%s) + 30*60 ))
          while :; do
            all_done=true
            for check in "${REQUIRED_CHECKS[@]}"; do
              encoded="${check// /%20}"
              row="$(gh api \
                "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?check_name=${encoded}" \
                --jq '.check_runs[0] | "\(.status)|\(.conclusion // "")"' || echo "missing|")"
              status="${row%%|*}"
              conclusion="${row##*|}"
              if [[ "${status}" != "completed" ]]; then
                all_done=false
                echo "waiting: ${check} (status=${status})"
                continue
              fi
              if [[ "${conclusion}" != "success" ]]; then
                echo "::error title=release::required check '${check}' concluded '${conclusion}'"
                exit 1
              fi
              echo "ok: ${check}"
            done
            if "${all_done}"; then
              echo "::notice title=release::all ${#REQUIRED_CHECKS[@]} required checks passed"
              break
            fi
            if (( $(date +%s) > DEADLINE )); then
              echo "::error title=release::timed out waiting for required checks"
              exit 1
            fi
            sleep 15
          done

  update-major-float:
    name: Force-push major float tag
    runs-on: ubuntu-latest
    needs: verify-tests-passed
    if: contains(github.ref_name, '.')
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Derive major float from tag
        id: derive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+ ]]; then
            echo "::notice::tag ${TAG} is not a release tag (no major float to update)"
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          MAJOR="v${BASH_REMATCH[1]}"
          echo "major=${MAJOR}" >> "${GITHUB_OUTPUT}"
          echo "skip=false" >> "${GITHUB_OUTPUT}"
          echo "::notice::moving ${MAJOR} -> ${GITHUB_SHA}"

      - name: Force-push major float tag
        if: steps.derive.outputs.skip != 'true'
        env:
          MAJOR: ${{ steps.derive.outputs.major }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR}" "${GITHUB_SHA}"
          git push origin "refs/tags/${MAJOR}" --force

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: verify-tests-passed
    if: contains(github.ref_name, '.')
    steps:
      - uses: actions/checkout@v7

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # If a release already exists for this tag (e.g. someone created
          # it via the UI before pushing), skip — `gh release create`
          # would fail. Idempotency is friendlier than yelling.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "::notice::release ${TAG} already exists, skipping"
            exit 0
          fi
          gh release create "${TAG}" \
            --title "${TAG}" \
            --generate-notes
